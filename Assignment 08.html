<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-layer web demo</title>
<style>
    .box{
        height: 600px;
        border: 1px solid white;
        display: flex;
        background-color:cornsilk;
    }
    .left{
        height: 100%;
        width: 30%;
        border: 1px solid white;
    }
    .right{
        height: 100%;
        width: 70%;
        border: 1px solid black;
        background-color:white;
    }
    a{
        text-decoration: none;
        color: aliceblue;
    }
    .button{
        text-transform: capitalize;
        margin: 50px;
        height: 30px;
        width: 100px;
        background-color:orange;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="left">
            <div class="button">
                <a href="Tarun Manghani ASSIGNMENT 01.html"   target="Spiderman" >Assignment 01 </a>
            </div>
            <div class="button">
                <a href="Tarun Manghani Assignment 02.html" target="Spiderman" >Assignment 02 </a>
            </div>
            <div class="button">
                <a href="Tarun Manghani Assignment 03.html" target="Spiderman" >Assignment 03 </a>
            </div>
            <div class="button">
                <a href="Tarun Manghani Assigment 04.html" target="Spiderman" >Assignment 04 </a>
            </div>
            <div class="button">
                <a href="Tarun Manghani Assignment 05.html" target="Spiderman" >Assignment 05</a>
            </div>
        </div>
        <div class="right">
            <iframe src="" frameborder="0" height="100%" width="100%" name="Spiderman"></iframe>
        </div>
    </div>
</body>
</html>
